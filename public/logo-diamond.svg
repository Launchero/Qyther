<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0f0f18"/>
  <g filter="url(#glow)">
    <!-- Diamond Q shape -->
    <polygon points="64,20 100,64 64,108 28,64" fill="none" stroke="url(#g1)" stroke-width="4" opacity="0.6"/>
    <!-- Inner diamond -->
    <polygon points="64,36 88,64 64,92 40,64" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.35"/>
    <!-- Center node -->
    <circle cx="64" cy="64" r="8" fill="url(#g1)"/>
    <!-- Tail -->
    <path d="M 82 82 L 104 106" stroke="url(#g1)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
