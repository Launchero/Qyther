<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="128" height="128" rx="28" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.15"/>

  <!-- Stylized Q icon - command palette launcher -->
  <g filter="url(#glowSoft)">
    <!-- Outer ring -->
    <circle cx="64" cy="64" r="38" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.85"/>
    
    <!-- Inner orbit -->
    <circle cx="64" cy="64" r="26" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.35"/>
    
    <!-- Q tail - dynamic slash -->
    <path d="M 90 90 L 108 108" stroke="url(#accent)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Center node -->
    <circle cx="64" cy="64" r="8" fill="url(#accent)" opacity="0.9"/>
    
    <!-- Orbital search arcs -->
    <path d="M 36 30 A 40 40 0 0 1 92 30" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <path d="M 28 48 A 40 40 0 0 1 40 32" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
    
    <!-- Sparkle dots -->
    <circle cx="94" cy="30" r="2.5" fill="#00d4ff" opacity="0.65"/>
    <circle cx="32" cy="86" r="2" fill="#7b61ff" opacity="0.5"/>
  </g>
</svg>
