<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Palette - Compact Mode (800x100)</title>
    <style>
        :root {
            /* Kraken Design System Colors */
            --white: #ffffff;
            --black: #101114;
            --purple: #7132f5;
            --purple-dark: #5741d8;
            --purple-subtle: rgba(133, 91, 251, 0.16);
            --gray: #686b82;
            --silver: #9497a9;
            --border: #dedee5;
            
            /* Shadows */
            --shadow-subtle: rgba(0, 0, 0, 0.03) 0px 4px 24px;
            --shadow-micro: rgba(16, 24, 40, 0.04) 0px 1px 4px;
            
            /* Typography */
            --font-ui: 'IBM Plex Sans', 'Kraken-Product', Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: var(--font-ui);
            -webkit-font-smoothing: antialiased;
        }

        /* Compact Command Palette Container - 800x100 */
        .command-palette {
            width: 800px;
            height: 100px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-subtle);
            display: flex;
            align-items: center;
            padding: 16px;
            gap: 12px;
        }

        /* Mode Dropdown Container */
        .mode-dropdown {
            position: relative;
            flex-shrink: 0;
        }

        /* Mode Toggle Button */
        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            height: 44px;
        }

        .mode-toggle:hover {
            border-color: var(--purple);
            background: var(--purple-subtle);
        }

        .mode-toggle:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 1px var(--purple);
        }

        .mode-icon {
            width: 18px;
            height: 18px;
            color: var(--purple);
            flex-shrink: 0;
        }

        .mode-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--purple);
            white-space: nowrap;
        }

        .dropdown-arrow {
            width: 14px;
            height: 14px;
            color: var(--silver);
            flex-shrink: 0;
        }

        /* Dropdown Menu */
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 220px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-subtle);
            padding: 8px;
            display: none;
            z-index: 1000;
        }

        .mode-dropdown.open .dropdown-menu {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .dropdown-item:hover {
            background: var(--purple-subtle);
        }

        .dropdown-item.active {
            background: var(--purple-subtle);
        }

        .dropdown-item-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .dropdown-item-icon.files {
            color: var(--purple);
        }

        .dropdown-item-icon.ask {
            color: #149e61;
        }

        .dropdown-item-icon.code {
            color: #d8571d;
        }

        .dropdown-item-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--black);
            flex: 1;
        }

        .dropdown-item-shortcut {
            font-size: 11px;
            color: var(--silver);
            font-family: monospace;
        }

        .dropdown-divider {
            height: 1px;
            background: var(--border);
            margin: 6px 0;
        }

        /* Search Input Container */
        .search-container {
            flex: 1;
            display: flex;
            align-items: center;
            height: 44px;
        }

        .search-input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            font-family: var(--font-ui);
            font-size: 16px;
            color: var(--black);
            background: transparent;
        }

        .search-input::placeholder {
            color: var(--silver);
        }

        /* Keyboard Shortcut */
        .keyboard-shortcut {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .shortcut-key {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            padding: 0 10px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray);
            box-shadow: var(--shadow-micro);
        }

        /* Divider Line */
        .divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        /* Presentation wrapper */
        .presentation {
            text-align: center;
        }

        .presentation-label {
            color: var(--silver);
            font-size: 12px;
            margin-bottom: 24px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="presentation">
        <div class="presentation-label">Compact Mode — 800×100px</div>
        
        <div class="command-palette">
            <!-- Mode Dropdown -->
            <div class="mode-dropdown" id="modeDropdown">
                <button class="mode-toggle" id="modeToggle">
                    <svg class="mode-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 7C3 5.89543 3.89543 5 5 5H9L11 7H19C20.1046 7 21 7.89543 21 9V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="mode-label" id="modeLabel">Files</span>
                    <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <!-- Dropdown Menu -->
                <div class="dropdown-menu">
                    <div class="dropdown-item active" data-mode="files">
                        <svg class="dropdown-item-icon files" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 7C3 5.89543 3.89543 5 5 5H9L11 7H19C20.1046 7 21 7.89543 21 9V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span class="dropdown-item-label">Files</span>
                        <span class="dropdown-item-shortcut">⌘F</span>
                    </div>
                    
                    <div class="dropdown-divider"></div>
                    
                    <div class="dropdown-item" data-mode="ask">
                        <svg class="dropdown-item-icon ask" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 10C8 10 9 8 12 8C15 8 16 10 16 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 12V12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <span class="dropdown-item-label">Ask</span>
                        <span class="dropdown-item-shortcut">⌘A</span>
                    </div>
                    
                    <div class="dropdown-divider"></div>
                    
                    <div class="dropdown-item" data-mode="code">
                        <svg class="dropdown-item-icon code" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16 18L22 12L16 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M8 6L2 12L8 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span class="dropdown-item-label">Code</span>
                        <span class="dropdown-item-shortcut">⌘C</span>
                    </div>
                </div>
            </div>

            <!-- Search Input -->
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Search for files, tools, actions..."
                    autofocus
                />
            </div>

            <!-- Keyboard Shortcut -->
            <div class="keyboard-shortcut">
                <div class="divider"></div>
                <div class="shortcut-key">⌘</div>
                <div class="shortcut-key">K</div>
            </div>
        </div>
    </div>

    <script>
        const modeDropdown = document.getElementById('modeDropdown');
        const modeToggle = document.getElementById('modeToggle');
        const modeLabel = document.getElementById('modeLabel');
        const modeIcon = modeToggle.querySelector('.mode-icon');
        const dropdownItems = document.querySelectorAll('.dropdown-item');

        // Mode configurations
        const modes = {
            files: {
                label: 'Files',
                icon: '<path d="M3 7C3 5.89543 3.89543 5 5 5H9L11 7H19C20.1046 7 21 7.89543 21 9V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
                color: 'var(--purple)'
            },
            ask: {
                label: 'Ask',
                icon: '<path d="M8 10C8 10 9 8 12 8C15 8 16 10 16 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 12V12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>',
                color: '#149e61'
            },
            code: {
                label: 'Code',
                icon: '<path d="M16 18L22 12L16 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 6L2 12L8 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
                color: '#d8571d'
            }
        };

        // Toggle dropdown
        modeToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            modeDropdown.classList.toggle('open');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', () => {
            modeDropdown.classList.remove('open');
        });

        // Handle mode selection
        dropdownItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const mode = item.dataset.mode;
                
                // Update active state
                dropdownItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                // Update toggle button
                modeLabel.textContent = modes[mode].label;
                modeIcon.innerHTML = modes[mode].icon;
                modeIcon.style.color = modes[mode].color;
                
                // Close dropdown
                modeDropdown.classList.remove('open');
            });
        });

        // Prevent dropdown from closing when clicking inside it
        modeDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
